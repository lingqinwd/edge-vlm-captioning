models:
  smolvlm_256m:
    model_id: HuggingFaceTB/SmolVLM-256M-Instruct
    parameter_count: 256M
    precision_stages: [fp16]
    role: realtime_baseline
  smolvlm_500m:
    model_id: HuggingFaceTB/SmolVLM-500M-Instruct
    parameter_count: 508M
    precision_stages: [fp16, int8, int4]
    role: balanced_candidate
  qwen2_5_vl_3b:
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    parameter_count: 3.75B
    precision_stages: [fp16, int8, int4]
